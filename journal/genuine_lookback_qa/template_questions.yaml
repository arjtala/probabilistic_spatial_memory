# Genuine look-back QA — annotation TEMPLATE (schema for scripts/eval_lookback.py)
#
# PURPOSE: blunt the "proxy benchmark" reviewer concern by evaluating PSM on a
# small set of human-authored, video-verified look-back questions ("where did I
# leave my keys?"), not the Nymeria third-person action narrations.
#
# HOW TO USE (on the cluster, where the session footage + clip_l_features.h5 live):
#   1. Pick 1-3 sessions with rich revisit structure (e.g. shelby_arroyo_act0).
#   2. Watch the footage and author 15-20 genuine look-back questions below,
#      filling in verified ground-truth intervals (seconds from session start).
#      DO NOT invent intervals -- each must correspond to footage you verified.
#   3. Have a second annotator independently verify a random 20%, resolve
#      disagreements against the footage, and freeze the YAML SHA-256.
#   4. Follow PROTOCOL.md to run seeds 0-4 at the frozen paper configuration.
#
# Balance categories toward true look-back cognition (object_recall,
# location_trace, spatial_awareness) rather than visual_detail_recall alone.

session_id: TODO_SESSION_ID
# session_start_unix: TODO   # optional; auto-detected if absent
iou_threshold: 0.3

questions:
  # ---- object recall: "where/when did I last see X?" ----
  - id: g01
    query: "TODO: e.g. my water bottle on the counter"
    category: object_recall
    intervals: [[TODO_START, TODO_END]]   # verified from footage
    notes: "TODO: what/where, for the annotator's record"

  - id: g02
    query: "TODO: the backpack I set down"
    category: object_recall
    intervals: [[TODO_START, TODO_END]]

  # ---- location trace: a PLACE the wearer revisited (spatial, encoder-bypass) ----
  - id: g03
    query: "TODO: the kitchen sink"           # text kept for the record
    category: location_trace
    query_mode: last_seen                      # isolates PSM's spatial substrate
    query_lat: TODO_LAT
    query_lng: TODO_LNG
    query_k_ring: 1
    intervals: [[TODO_START, TODO_END]]

  # ---- spatial awareness (semantic retrieval) ----
  - id: g04
    query: "TODO: e.g. the doorway where I entered the kitchen"
    category: spatial_awareness
    intervals: [[TODO_START, TODO_END]]
    notes: "TODO: verify the visible spatial cue and interval"

  # ... author ~15-20 total, across categories ...
