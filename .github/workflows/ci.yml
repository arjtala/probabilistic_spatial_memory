name: ci

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} portable test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Install shared dependencies
        run: brew install h3 hdf5 glfw

      - name: Install Linux OpenGL test dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglfw3-dev

      - name: Run portable test suite
        run: make PROFILE=portable test

      - name: Build portable CLI
        run: |
          make PROFILE=portable all

  sanitize:
    name: ubuntu sanitizer test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Install shared dependencies
        run: brew install h3 hdf5 glfw

      - name: Install Linux OpenGL test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglfw3-dev

      - name: Run sanitizer test suite
        run: make PROFILE=sanitize test

  debug-build:
    name: ubuntu debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Install shared dependencies
        run: brew install h3 hdf5 glfw

      - name: Build debug CLI
        run: make PROFILE=debug all

      - name: Build benchmarks
        run: |
          make PROFILE=debug targets/debug/benchmark_spatial_memory
          make PROFILE=debug targets/debug/benchmark_nymeria_psm_query
          # benchmark_tile_decode links -lz (zlib) which is not provisioned
          # here, so it is skipped; the two above cover the C benchmark surface.

  extraction:
    name: ubuntu extraction pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install extraction package
        run: pip install -e extraction[dev]

      - name: Run extraction test suite
        run: pytest extraction/tests
